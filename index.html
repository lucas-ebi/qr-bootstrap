<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>QR Bootstrap</title>
  <style>
    :root { --bg: #0b0b0c; --fg: #ececec; --dim: #8a8a8f; --accent: #60a5fa; --err: #f87171; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 14px/1.4 system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75); }

    /* Tracks the QR code under the camera */
    #frame {
      position: fixed; top: 50%; left: 50%; width: 220px; height: 220px;
      transform: translate(-50%, -50%);
      pointer-events: none; opacity: 0;
      transition: left .15s ease-out, top .15s ease-out, width .15s ease-out, height .15s ease-out, opacity .2s;
    }
    #frame.on { opacity: 1; }
    #frame::before, #frame::after, #frame b::before, #frame b::after {
      content: ''; position: absolute; width: 28px; height: 28px; border: 3px solid var(--fg); border-radius: 4px;
      transition: border-color .15s;
    }
    #frame.pulse::before, #frame.pulse::after, #frame.pulse b::before, #frame.pulse b::after { border-color: var(--accent); }
    #frame::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    #frame::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    #frame b { position: absolute; inset: 0; }
    #frame b::before { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    #frame b::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }

    #hud {
      position: fixed; left: 16px; right: 16px; bottom: max(20px, env(safe-area-inset-bottom));
      margin: 0 auto; max-width: 420px; padding: 12px 16px;
      background: rgba(11, 11, 12, 0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
    }
    #state { display: flex; justify-content: space-between; gap: 12px; }
    #state span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; }
    #hud.err #state span:first-child { color: var(--err); }
    #bar { height: 3px; margin-top: 10px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    #fatal {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      padding: 32px; background: var(--bg); color: var(--dim); text-align: center;
    }
    #fatal strong { display: block; color: var(--fg); margin-bottom: 6px; font-size: 16px; }
    /* Confirmation dialog */
    #ask {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
      background: rgba(0, 0, 0, 0.6);
    }
    #ask > div {
      width: 100%; max-width: 360px; padding: 20px; background: #161618;
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px;
    }
    #ask h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    #ask p { color: var(--dim); margin-bottom: 18px; overflow-wrap: anywhere; }
    #ask .row { display: flex; gap: 10px; justify-content: flex-end; }
    button {
      font: inherit; color: var(--fg); background: rgba(255, 255, 255, 0.08); cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 8px; padding: 8px 16px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }

    /* Sandboxed HTML payload */
    #app { position: fixed; inset: 0; z-index: 5; background: var(--bg); }
    #app iframe { width: 100%; height: 100%; border: 0; }
    #app button {
      position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px;
      width: 36px; height: 36px; padding: 0; font-size: 20px; line-height: 1; opacity: 0.7;
      background: rgba(11, 11, 12, 0.7);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <div id="frame"><b></b></div>
  <div id="hud" role="status" aria-live="polite">
    <div id="state"><span>Starting…</span><span></span></div>
    <div id="bar"><i></i></div>
  </div>
  <div id="fatal" class="hidden"><div><strong></strong><span></span></div></div>
  <div id="ask" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ask-title">
    <div>
      <h2 id="ask-title"></h2>
      <p id="ask-detail"></p>
      <div class="row"><button id="ask-no">Cancel</button><button id="ask-yes" class="primary">Run</button></div>
    </div>
  </div>

<script type="module">
import { Receiver, loadKey } from './fountain.js';

// Ed25519 public keys (base64url) allowed to sign payloads.
// Generate a pair with: node tools/encode.mjs keygen   (see README)
const TRUSTED_KEYS = [];

const $ = id => document.getElementById(id);
const video = $('cam'), frameEl = $('frame'), hud = $('hud');
const [stateEl, countEl] = hud.querySelectorAll('#state span'), barEl = $('bar').firstElementChild;

function show(text, { count = '', pct = 0, err = false } = {}) {
  stateEl.textContent = text;
  countEl.textContent = count;
  barEl.style.width = pct + '%';
  hud.classList.toggle('err', err);
}

function fatal(title, detail) {
  $('fatal').querySelector('strong').textContent = title;
  $('fatal').querySelector('span').textContent = detail;
  $('fatal').classList.remove('hidden');
}

// ---- Support checks ---------------------------------------------------------
const missing = [
  !isSecureContext && 'a secure context (serve over HTTPS or localhost)',
  isSecureContext && !navigator.mediaDevices?.getUserMedia && 'camera access',
].filter(Boolean);
if (missing.length) {
  fatal('Unsupported browser', 'Missing: ' + missing.join(', '));
  throw new Error('unsupported: ' + missing.join(', '));
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---- Local state: highest version run and approvals, per app id --------------
const store = {
  get: k => { try { return localStorage.getItem('qb:' + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem('qb:' + k, v); } catch {} },
};

// Refuse anything older than what already ran (replay / rollback protection).
function accept({ id, version }) {
  if (version < (+store.get('v:' + id) || 0)) throw new Error('older version');
}

let asking = Promise.resolve(); // one dialog at a time
function confirmRun({ id, type, version, signer }) {
  return asking = asking.then(() => new Promise(resolve => {
    $('ask-title').textContent = `Run “${id}”?`;
    $('ask-detail').textContent = `${type} · version ${version} · signed by ${signer}`;
    const done = ok => { $('ask').classList.add('hidden'); resolve(ok); };
    $('ask-yes').onclick = () => done(true);
    $('ask-no').onclick = () => done(false);
    $('ask').classList.remove('hidden');
    $('ask-yes').focus();
  }));
}

// ---- Payload activation -----------------------------------------------------
const modules = new Map();
let stream = null, scanning = false, decode = null;

// HTML payloads get an opaque origin (no allow-same-origin): no access to this page's
// storage, cache or service worker, or to other sites on the same host.
function runHtml(id, html) {
  stopScanner();
  const app = document.createElement('div'), frame = document.createElement('iframe'), close = document.createElement('button');
  app.id = 'app';
  frame.setAttribute('sandbox', 'allow-scripts');
  frame.title = id;
  frame.srcdoc = html;
  close.textContent = '×';
  close.setAttribute('aria-label', 'Close ' + id);
  close.onclick = () => { app.remove(); show('Point at a QR stream'); startScanner(); };
  app.append(frame, close);
  document.body.append(app);
  frame.focus();
}

async function activate({ type, id, payload }) {
  const text = () => new TextDecoder().decode(payload);
  if (type === 'json') {
    modules.set(id, JSON.parse(text()));
  } else if (type === 'html') {
    runHtml(id, text());
  } else if (type === 'mjs') {
    const url = URL.createObjectURL(new Blob([text()], { type: 'text/javascript' }));
    try {
      const mod = await import(url);
      modules.set(id, mod);
      if (typeof mod.init === 'function') await mod.init({ id, modules, log: console.log, startScanner, stopScanner });
    } finally {
      URL.revokeObjectURL(url);
    }
  } else {
    throw new Error('unknown type ' + type);
  }
}

// ---- Receiving --------------------------------------------------------------
let receiver;

async function onScan(raw) {
  const r = await receiver.push(raw);
  if (!r) return;
  frameEl.classList.remove('pulse');
  void frameEl.offsetWidth;
  frameEl.classList.add('pulse');

  if (r.error) return show('Rejected', { count: r.error, err: true });
  if (!r.opened) return show('Receiving', { count: `${r.rank}/${r.n}`, pct: r.rank / r.n * 100 });

  const app = r.opened;
  if (store.get('ok:' + app.id) !== app.signer) { // first run of this app from this signer
    show('Waiting for confirmation', { count: app.id, pct: 100 });
    if (!await confirmRun(app)) {
      receiver.hold(r.id, 30000);
      return show('Cancelled', { count: app.id });
    }
    store.set('ok:' + app.id, app.signer);
  }
  store.set('v:' + app.id, String(Math.max(app.version, +store.get('v:' + app.id) || 0)));
  try {
    show('Running', { count: app.id, pct: 100 });
    await activate(app);
  } catch (e) {
    console.error(e);
    show('Failed to run ' + app.id, { count: e.message, err: true });
  }
}

// ---- QR decoding ------------------------------------------------------------
// Use the browser's built-in detector where there is one (Chrome on Android, macOS, ChromeOS);
// otherwise load the vendored jsQR (desktop Linux/Windows, Firefox, Safari, iOS).
// Either way: decode(video) -> [{ rawValue, boundingBox }], with the box in video pixels.
async function makeDecoder() {
  if ('BarcodeDetector' in window) {
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    return async v => (await detector.detect(v)).map(({ rawValue, boundingBox }) => ({ rawValue, boundingBox }));
  }
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'vendor/jsQR.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('could not load vendor/jsQR.js'));
    document.head.append(s);
  });
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  return async v => {
    const k = Math.min(1, 800 / v.videoWidth), w = Math.round(v.videoWidth * k), h = Math.round(v.videoHeight * k);
    if (canvas.width !== w || canvas.height !== h) [canvas.width, canvas.height] = [w, h];
    ctx.drawImage(v, 0, 0, w, h);
    const { data } = ctx.getImageData(0, 0, w, h);
    const code = jsQR(data, w, h, { inversionAttempts: 'dontInvert' });
    if (!code) return [];
    const { topLeftCorner: a, topRightCorner: b, bottomRightCorner: c, bottomLeftCorner: d } = code.location;
    const xs = [a.x, b.x, c.x, d.x], ys = [a.y, b.y, c.y, d.y];
    const [x0, y0] = [Math.min(...xs), Math.min(...ys)];
    return [{
      rawValue: code.data,
      boundingBox: { x: x0 / k, y: y0 / k, width: (Math.max(...xs) - x0) / k, height: (Math.max(...ys) - y0) / k },
    }];
  };
}

// ---- Camera -----------------------------------------------------------------
async function startScanner() {
  if (scanning) return;
  try {
    decode ??= await makeDecoder();
  } catch (e) {
    return show('QR decoder unavailable', { count: e.message, err: true });
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    if (!hud.classList.contains('err')) show('Point at a QR stream');
    scanLoop();
  } catch (e) {
    show('Camera unavailable', { count: e.name === 'NotAllowedError' ? 'permission denied' : e.message, err: true });
  }
}

function stopScanner() {
  scanning = false;
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
}

let frameTimer;
function trackCode({ boundingBox: box }) {
  if (!box) return;
  // Map video pixel coords to screen coords (video is object-fit: cover)
  const vw = innerWidth, vh = innerHeight, w = video.videoWidth, h = video.videoHeight;
  const scale = Math.max(vw / w, vh / h);
  const ox = (vw - w * scale) / 2, oy = (vh - h * scale) / 2;
  const size = Math.max(box.width, box.height) * scale + 24;
  Object.assign(frameEl.style, {
    left: ox + (box.x + box.width / 2) * scale + 'px',
    top: oy + (box.y + box.height / 2) * scale + 'px',
    width: size + 'px',
    height: size + 'px',
  });
  frameEl.classList.add('on');
  clearTimeout(frameTimer);
  frameTimer = setTimeout(() => frameEl.classList.remove('on'), 300);
}

async function scanLoop() {
  if (!scanning) return;
  try {
    if (video.videoWidth > 0) {
      for (const code of await decode(video)) {
        trackCode(code);
        onScan(code.rawValue || '');
      }
    }
  } catch {}
  requestAnimationFrame(scanLoop);
}

// ---- Start ------------------------------------------------------------------
try {
  receiver = new Receiver(await Promise.all(TRUSTED_KEYS.map(loadKey)), { accept });
} catch (e) {
  fatal('Unsupported browser', 'Ed25519 signature verification is not available');
  throw e;
}
if (!TRUSTED_KEYS.length) show('No trusted signing key', { count: 'see README', err: true });

// A QR that opens this page as a URL can carry its first frame in the hash
if (location.hash.length > 1) {
  let frag = location.hash.slice(1);
  try { frag = decodeURIComponent(frag); } catch {}
  onScan(frag);
}

startScanner();
window.qrboot = { modules, startScanner, stopScanner };
</script>
</body>
</html>
