<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050805">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>QR Bootstrap</title>
  <!-- Only what the boot program needs; the core brings the rest of the interface. -->
  <style>
    html, body { margin: 0; height: 100%; background: #050805; color: #33ff66; }
    #log { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px; white-space: pre-wrap;
      font: 14px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-transform: uppercase; }
  </style>
</head>
<body>
  <pre id="log">QR BOOTSTRAP
</pre>
  <script type="module" src="boot.js"></script>
</body>
</html>
