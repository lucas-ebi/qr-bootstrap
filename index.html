<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>QR Bootstrap</title>
  <style>
    :root { --bg: #0b0b0c; --fg: #ececec; --dim: #8a8a8f; --accent: #60a5fa; --err: #f87171; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 14px/1.4 system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75); }

    /* Tracks the QR code under the camera */
    #frame {
      position: fixed; top: 50%; left: 50%; width: 220px; height: 220px;
      transform: translate(-50%, -50%);
      pointer-events: none; opacity: 0;
      transition: left .15s ease-out, top .15s ease-out, width .15s ease-out, height .15s ease-out, opacity .2s;
    }
    #frame.on { opacity: 1; }
    #frame::before, #frame::after, #frame b::before, #frame b::after {
      content: ''; position: absolute; width: 28px; height: 28px; border: 3px solid var(--fg); border-radius: 4px;
      transition: border-color .15s;
    }
    #frame.pulse::before, #frame.pulse::after, #frame.pulse b::before, #frame.pulse b::after { border-color: var(--accent); }
    #frame::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    #frame::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    #frame b { position: absolute; inset: 0; }
    #frame b::before { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    #frame b::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }

    #hud {
      position: fixed; left: 16px; right: 16px; bottom: max(20px, env(safe-area-inset-bottom));
      margin: 0 auto; max-width: 420px; padding: 12px 16px;
      background: rgba(11, 11, 12, 0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
    }
    #state { display: flex; justify-content: space-between; gap: 12px; }
    #state span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; }
    #hud.err #state span:first-child { color: var(--err); }
    #bar { height: 3px; margin-top: 10px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    #fatal {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      padding: 32px; background: var(--bg); color: var(--dim); text-align: center;
    }
    #fatal strong { display: block; color: var(--fg); margin-bottom: 6px; font-size: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <div id="frame"><b></b></div>
  <div id="hud" role="status" aria-live="polite">
    <div id="state"><span>Starting…</span><span></span></div>
    <div id="bar"><i></i></div>
  </div>
  <div id="fatal" class="hidden"><div><strong></strong><span></span></div></div>

<script type="module">
import { Receiver, importKey } from './fountain.js';

// Ed25519 public keys (base64url) allowed to sign payloads.
// Generate a pair with: node tools/encode.mjs keygen   (see README)
const TRUSTED_KEYS = [];

const $ = id => document.getElementById(id);
const video = $('cam'), frameEl = $('frame'), hud = $('hud');
const [stateEl, countEl] = hud.querySelectorAll('#state span'), barEl = $('bar').firstElementChild;

function show(text, { count = '', pct = 0, err = false } = {}) {
  stateEl.textContent = text;
  countEl.textContent = count;
  barEl.style.width = pct + '%';
  hud.classList.toggle('err', err);
}

function fatal(title, detail) {
  $('fatal').querySelector('strong').textContent = title;
  $('fatal').querySelector('span').textContent = detail;
  $('fatal').classList.remove('hidden');
}

// ---- Support checks ---------------------------------------------------------
const missing = [
  !isSecureContext && 'a secure context (serve over HTTPS or localhost)',
  isSecureContext && !navigator.mediaDevices?.getUserMedia && 'camera access',
  !('BarcodeDetector' in window) && 'BarcodeDetector (use Chrome or Edge)',
].filter(Boolean);
if (missing.length) {
  fatal('Unsupported browser', 'Missing: ' + missing.join(', '));
  throw new Error('unsupported: ' + missing.join(', '));
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---- Payload activation -----------------------------------------------------
const modules = new Map();
let stream = null, scanning = false, detector = null;

async function activate({ type, id, payload }) {
  const text = () => new TextDecoder().decode(payload);
  if (type === 'json') {
    modules.set(id, JSON.parse(text()));
  } else if (type === 'html') {
    location.href = URL.createObjectURL(new Blob([text()], { type: 'text/html' }));
  } else if (type === 'mjs') {
    const url = URL.createObjectURL(new Blob([text()], { type: 'text/javascript' }));
    try {
      const mod = await import(url);
      modules.set(id, mod);
      if (typeof mod.init === 'function') await mod.init({ id, modules, log: console.log, startScanner, stopScanner });
    } finally {
      URL.revokeObjectURL(url);
    }
  } else {
    throw new Error('unknown type ' + type);
  }
}

// ---- Receiving --------------------------------------------------------------
let receiver;

async function onScan(raw) {
  const r = await receiver.push(raw);
  if (!r) return;
  frameEl.classList.remove('pulse');
  void frameEl.offsetWidth;
  frameEl.classList.add('pulse');

  if (r.error) return show('Rejected', { count: r.error, err: true });
  if (!r.opened) return show('Receiving', { count: `${r.rank}/${r.n}`, pct: r.rank / r.n * 100 });
  try {
    show('Running', { count: r.opened.id, pct: 100 });
    await activate(r.opened);
  } catch (e) {
    console.error(e);
    show('Failed to run ' + r.opened.id, { count: e.message, err: true });
  }
}

// ---- Camera -----------------------------------------------------------------
async function startScanner() {
  if (scanning) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    detector ??= new BarcodeDetector({ formats: ['qr_code'] });
    scanning = true;
    if (!hud.classList.contains('err')) show('Point at a QR stream');
    scanLoop();
  } catch (e) {
    show('Camera unavailable', { count: e.name === 'NotAllowedError' ? 'permission denied' : e.message, err: true });
  }
}

function stopScanner() {
  scanning = false;
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
}

let frameTimer;
function trackCode({ boundingBox: box }) {
  if (!box) return;
  // Map video pixel coords to screen coords (video is object-fit: cover)
  const vw = innerWidth, vh = innerHeight, w = video.videoWidth, h = video.videoHeight;
  const scale = Math.max(vw / w, vh / h);
  const ox = (vw - w * scale) / 2, oy = (vh - h * scale) / 2;
  const size = Math.max(box.width, box.height) * scale + 24;
  Object.assign(frameEl.style, {
    left: ox + (box.x + box.width / 2) * scale + 'px',
    top: oy + (box.y + box.height / 2) * scale + 'px',
    width: size + 'px',
    height: size + 'px',
  });
  frameEl.classList.add('on');
  clearTimeout(frameTimer);
  frameTimer = setTimeout(() => frameEl.classList.remove('on'), 300);
}

async function scanLoop() {
  if (!scanning) return;
  try {
    if (video.videoWidth > 0) {
      for (const code of await detector.detect(video)) {
        trackCode(code);
        onScan(code.rawValue || '');
      }
    }
  } catch {}
  requestAnimationFrame(scanLoop);
}

// ---- Start ------------------------------------------------------------------
try {
  receiver = new Receiver(await Promise.all(TRUSTED_KEYS.map(importKey)));
} catch (e) {
  fatal('Unsupported browser', 'Ed25519 signature verification is not available');
  throw e;
}
if (!TRUSTED_KEYS.length) show('No trusted signing key', { count: 'see README', err: true });

// A QR that opens this page as a URL can carry its first frame in the hash
if (location.hash.length > 1) {
  let frag = location.hash.slice(1);
  try { frag = decodeURIComponent(frag); } catch {}
  onScan(frag);
}

startScanner();
window.qrboot = { modules, startScanner, stopScanner };
</script>
</body>
</html>
