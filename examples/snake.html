<!DOCTYPE html>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
  /* Phosphor terminal, like the loader. */
  :root { --s: min(94vw, 88vh); }
  @media (pointer: coarse) { :root { --s: min(94vw, 52vh); } }
  html, body {
    margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    background: #050805; color: #33ff66; text-transform: uppercase; text-shadow: 0 0 4px #33ff6699;
    font: 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { width: var(--s); height: var(--s); box-sizing: border-box; border: 2px solid #33ff66; image-rendering: pixelated; }
  #info { width: var(--s); display: flex; justify-content: space-between; }
  /* The same cross of arrows as Tetris. */
  #pad { display: none; grid-template: repeat(3, 52px) / repeat(3, 52px); gap: 2px; justify-content: center; }
  @media (pointer: coarse) { #pad { display: grid; } }
  #pad button {
    font: inherit; font-size: 22px; color: #33ff66; background: #050805; touch-action: none; border: 2px solid #33ff66; padding: 0;
  }
  #pad button:active { background: #33ff66; color: #050805; }
  #pad [data-d="0,-1"] { grid-area: 1 / 2; } #pad [data-d="-1,0"] { grid-area: 2 / 1; }
  #pad [data-d="1,0"] { grid-area: 2 / 3; } #pad [data-d="0,1"] { grid-area: 3 / 2; }
</style>
<div id="info"><span id="score">SCORE 0000</span><span id="hint"></span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="pad">
  <button data-d="0,-1" aria-label="Up">▲</button>
  <button data-d="-1,0" aria-label="Left">◀</button>
  <button data-d="0,1" aria-label="Down">▼</button>
  <button data-d="1,0" aria-label="Right">▶</button>
</div>
<script>
// Snake in one file. Steer with the on-screen buttons, swipes, arrows or WASD.
// After game over, tap or press any key to restart.
const N = 20, S = 20, g = document.getElementById('c').getContext('2d');
const scoreEl = document.getElementById('score'), hintEl = document.getElementById('hint');
const touch = matchMedia('(pointer: coarse)').matches;
let snake, dir, next, food, score, dead;

function place() {
  do food = { x: Math.random() * N | 0, y: Math.random() * N | 0 };
  while (snake.some(p => p.x === food.x && p.y === food.y));
}

function reset() {
  snake = [{ x: 10, y: 10 }];
  dir = next = { x: 1, y: 0 };
  score = 0;
  dead = false;
  place();
}

function steer(x, y) {
  if (dead) return reset();
  if (x !== -dir.x || y !== -dir.y) next = { x, y };
}

function tick() {
  if (!dead) {
    dir = next;
    const h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
    if (snake.some(p => p.x === h.x && p.y === h.y)) dead = true;
    else {
      snake.unshift(h);
      if (h.x === food.x && h.y === food.y) { score++; place(); } else snake.pop();
    }
  }
  draw();
}

function draw() {
  g.fillStyle = '#050805';
  g.fillRect(0, 0, N * S, N * S);
  g.fillStyle = '#0d2412'; // dot grid, like an unlit display
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) g.fillRect(x * S + S / 2 - 1, y * S + S / 2 - 1, 2, 2);
  g.fillStyle = '#b6ffc9';
  g.fillRect(food.x * S + 5, food.y * S + 5, S - 10, S - 10);
  g.fillStyle = dead ? '#1a9c40' : '#33ff66';
  for (const p of snake) g.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
  document.title = 'Snake ' + score + (dead ? ' (game over)' : '');
  scoreEl.textContent = 'SCORE ' + String(score).padStart(4, '0');
  hintEl.textContent = dead ? (touch ? 'GAME OVER - TAP' : 'GAME OVER - PRESS ANY KEY') : (touch ? 'BUTTONS OR SWIPE' : 'ARROWS OR WASD');
}

const KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener('keydown', e => KEYS[e.key] ? steer(...KEYS[e.key]) : dead && reset());

document.getElementById('pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (b) steer(...b.dataset.d.split(',').map(Number));
});

let t0;
addEventListener('touchstart', e => { t0 = e.touches[0]; });
addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return dead && reset();
  Math.abs(dx) > Math.abs(dy) ? steer(Math.sign(dx), 0) : steer(0, Math.sign(dy));
});

reset();
setInterval(tick, 120);
</script>
